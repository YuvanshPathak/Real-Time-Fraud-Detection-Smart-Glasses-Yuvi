; PlatformIO Project Configuration File — XIAO ESP32-S3 Sense.
;
; Two builds: seeed_xiao_esp32s3 (default, voice only — the verified demo
; firmware) and glasses_camera (voice + camera face/document checks).
; Flash the camera build with: pio run -e glasses_camera -t upload -t monitor
;
; Uses the pioarduino fork of platform-espressif32, not the official PlatformIO
; registry: the official espressif32 platform is stuck on ESP-IDF 4.4, which is
; too old for the mic driver's driver/i2s_pdm.h (needs ESP-IDF 5.x). Confirmed
; during last firmware phase — do not switch back without re-checking this.
;
; https://docs.platformio.org/page/projectconf.html

; Without this, a bare `pio run -t upload` would build and flash BOTH envs
; in turn (ending on the camera build).
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; qio_opi = the PSRAM mode equivalent to Arduino IDE's "Tools > PSRAM > OPI PSRAM".
; Without this, psramFound() reports false despite the hardware having 8MB PSRAM,
; and large buffer allocations (WAV + multipart body) silently fall back to
; internal SRAM (~270KB) and fail. Confirmed root cause last phase.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    ; ESP32-S3 native USB CDC: without this, early boot Serial output can be
    ; lost to USB re-enumeration on reset (observed last phase).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

; Voice + camera (face check each cycle; document check while BOOT is held).
; Same board settings as above, plus the camera code compiled in.
[env:glasses_camera]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DENABLE_CAMERA
